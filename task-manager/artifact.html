<title>タスク管理</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@600&display=swap">
<style>
  :root {
    --bg: #f1f2f5;
    --surface: #ffffff;
    --surface-2: #e8eaf0;
    --ink: #171a21;
    --ink-2: #4a5160;
    --ink-3: #8a91a1;
    --line: #dadde5;
    --line-soft: #e6e8ee;
    --accent: #2f4b8f;
    --accent-ink: #ffffff;
    --accent-soft: #e3e9f7;
    --done: #3e7a5e;
    --done-soft: #e2efe8;
    --danger: #a3423a;
    --danger-soft: #f6e4e1;
    --shadow: 0 1px 2px rgba(23, 26, 33, .06), 0 8px 24px -12px rgba(23, 26, 33, .18);
    --font-ui: "Zen Kaku Gothic New", -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    --font-display: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12141a;
      --surface: #1a1d25;
      --surface-2: #232734;
      --ink: #edeff4;
      --ink-2: #a8afc0;
      --ink-3: #6e7687;
      --line: #2c3140;
      --line-soft: #232732;
      --accent: #93abe8;
      --accent-ink: #10131a;
      --accent-soft: #212842;
      --done: #6fb894;
      --done-soft: #1c2d26;
      --danger: #e08d84;
      --danger-soft: #34211f;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px -14px rgba(0, 0, 0, .7);
    }
  }
  :root[data-theme="dark"] {
    --bg: #12141a;
    --surface: #1a1d25;
    --surface-2: #232734;
    --ink: #edeff4;
    --ink-2: #a8afc0;
    --ink-3: #6e7687;
    --line: #2c3140;
    --line-soft: #232732;
    --accent: #93abe8;
    --accent-ink: #10131a;
    --accent-soft: #212842;
    --done: #6fb894;
    --done-soft: #1c2d26;
    --danger: #e08d84;
    --danger-soft: #34211f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px -14px rgba(0, 0, 0, .7);
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 16px;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }
  .wrap {
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    padding-inline: 18px;
    padding-block: 26px 64px;
    display: flex;
    flex-direction: column;
    gap: 30px;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* ---- masthead ---- */
  .masthead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .masthead h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 25px;
    letter-spacing: .06em;
    margin: 0;
    line-height: 1.2;
  }
  .status {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    letter-spacing: .02em;
    color: var(--ink-3);
    white-space: nowrap;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); flex: none; }
  .status[data-state="synced"] .dot { background: var(--done); }
  .status[data-state="local"] .dot { background: #c9922f; }

  /* ---- compose ---- */
  .compose {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 16px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .eyebrow {
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: .14em;
    color: var(--accent);
    display: block;
  }
  #compose-input {
    width: 100%;
    min-height: 88px;
    max-height: 40vh;
    resize: none;
    border: 0;
    outline: none;
    background: transparent;
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 19px;
    font-weight: 500;
    line-height: 1.5;
    padding: 0;
    overflow-y: auto;
  }
  #compose-input::placeholder { color: var(--ink-3); font-weight: 400; }
  #compose-input:focus-visible { outline: none; }
  .compose:focus-within { border-color: var(--accent); }
  .compose-foot {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    border-top: 1px solid var(--line-soft);
    padding-top: 11px;
  }
  .urgent-toggle {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    min-height: 44px;
    padding-right: 6px;
    cursor: pointer;
    position: relative;
    -webkit-tap-highlight-color: transparent;
  }
  .urgent-toggle input {
    position: absolute;
    width: 1px; height: 1px;
    opacity: 0;
    margin: 0;
  }
  .urgent-toggle .box {
    width: 22px; height: 22px;
    flex: none;
    border: 1.8px solid var(--ink-3);
    border-radius: 6px;
    display: grid; place-items: center;
    transition: border-color .15s ease, background .15s ease;
  }
  .urgent-toggle .box svg { width: 13px; height: 13px; display: block; }
  .urgent-toggle .box svg path { stroke: transparent; }
  .urgent-toggle:hover .box { border-color: var(--danger); }
  .urgent-toggle .text {
    font-size: 14.5px;
    color: var(--ink-2);
    letter-spacing: .04em;
  }
  #urgent-flag:checked + .box {
    background: var(--danger);
    border-color: var(--danger);
  }
  #urgent-flag:checked + .box svg path { stroke: var(--accent-ink); }
  #urgent-flag:checked ~ .text { color: var(--danger); font-weight: 700; }
  #urgent-flag:focus-visible + .box { outline: 2px solid var(--accent); outline-offset: 2px; }
  #add-btn {
    flex: none;
    min-height: 44px;
    padding: 0 22px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: var(--font-ui);
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .06em;
    cursor: pointer;
    transition: opacity .15s ease, transform .12s ease;
  }
  #add-btn:hover { opacity: .88; }
  #add-btn:active { transform: translateY(1px); }
  #add-btn:disabled {
    background: var(--surface-2);
    color: var(--ink-3);
    cursor: default;
    transform: none;
    opacity: 1;
  }

  /* ---- sections ---- */
  .sec-head { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .sec-head h2 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 19px;
    letter-spacing: .08em;
    margin: 0;
    flex: none;
  }
  .count {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    color: var(--ink-2);
    background: var(--surface-2);
    border-radius: 999px;
    padding: 2px 9px;
    flex: none;
  }
  .rule { flex: 1 1 auto; height: 1px; background: var(--line); }
  .sec-tool {
    flex: none;
    border: 0; background: none;
    font-family: var(--font-ui);
    font-size: 12.5px;
    color: var(--ink-3);
    cursor: pointer;
    padding: 6px 2px;
    min-height: 32px;
  }
  .sec-tool:hover { color: var(--ink); }

  /* ---- task rows ---- */
  .list { list-style: none; margin: 0; padding: 0; }
  .task {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 6px 0;
    border-bottom: 1px solid var(--line-soft);
  }
  .task:last-child { border-bottom: 0; }
  .task.is-urgent { box-shadow: inset 3px 0 0 var(--danger); }
  .task.is-urgent.is-done { box-shadow: none; }
  .task.enter { animation: rise .22s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .task.enter { animation: none; } }

  .check {
    flex: none;
    min-width: 44px; min-height: 44px;
    display: grid; place-items: center;
    border: 0; background: none; padding: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .check .ring {
    width: 23px; height: 23px;
    border: 1.8px solid var(--ink-3);
    border-radius: 50%;
    display: grid; place-items: center;
    transition: border-color .15s ease, background .15s ease;
  }
  .check svg { width: 13px; height: 13px; display: block; }
  .check .ring svg path { stroke: transparent; }
  .check:hover .ring { border-color: var(--done); }
  .check:hover .ring svg path { stroke: var(--done); }
  .task.is-done .check .ring { background: var(--done); border-color: var(--done); }
  .task.is-done .check .ring svg path { stroke: var(--accent-ink); }
  .task.is-done .check:hover .ring { background: transparent; }
  .task.is-done .check:hover .ring svg path { stroke: var(--done); }

  .task-body { flex: 1 1 auto; min-width: 0; padding: 9px 0 7px; }
  .task-text {
    margin: 0;
    font-size: 16.5px;
    line-height: 1.5;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .task.is-done .task-text { color: var(--ink-3); text-decoration: line-through; text-decoration-thickness: 1px; }
  .flag {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .1em;
    color: var(--danger);
    background: var(--danger-soft);
    border-radius: 4px;
    padding: 1px 6px;
    margin-right: 7px;
    vertical-align: 1px;
  }
  .task.is-done .flag { color: var(--ink-3); background: var(--surface-2); }
  .task-meta {
    display: block;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 11.5px;
    color: var(--ink-3);
    margin-top: 2px;
  }
  .kill {
    flex: none;
    min-width: 40px; min-height: 44px;
    border: 0; background: none;
    color: var(--ink-3);
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
    opacity: .5;
    transition: opacity .15s ease, color .15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .kill:hover { opacity: 1; color: var(--danger); }

  .empty {
    margin: 0;
    padding: 14px 0 4px;
    font-size: 14px;
    color: var(--ink-3);
  }
  #notice {
    margin: 0;
    padding: 10px 13px;
    border-radius: 10px;
    background: var(--accent-soft);
    color: var(--ink);
    font-size: 13.5px;
    border: 1px solid var(--line);
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
</style>

<div class="wrap">
  <header class="masthead">
    <h1>タスク管理</h1>
    <span class="status" id="status" data-state="boot"><span class="dot"></span><span id="status-text">接続中…</span></span>
  </header>

  <p id="notice" hidden></p>

  <section class="compose" aria-labelledby="compose-label">
    <label class="eyebrow" id="compose-label" for="compose-input">新規追加</label>
    <textarea id="compose-input" placeholder="やることを入力" rows="3" maxlength="1000"
      autocomplete="off" autocapitalize="sentences" spellcheck="false" enterkeyhint="done"></textarea>
    <div class="compose-foot">
      <label class="urgent-toggle" for="urgent-flag">
        <input type="checkbox" id="urgent-flag">
        <span class="box"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M2.5 8.5 L6 12 L13.5 4" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="text">緊急</span>
      </label>
      <button id="add-btn" type="button" disabled>追加</button>
    </div>
  </section>

  <section aria-labelledby="pending-label">
    <div class="sec-head">
      <h2 id="pending-label">未完了</h2>
      <span class="count" id="pending-count">0</span>
      <span class="rule"></span>
    </div>
    <ul class="list" id="pending-list"></ul>
    <p class="empty" id="pending-empty">未完了のタスクはありません。上の入力欄から追加できます。</p>
  </section>

  <section aria-labelledby="done-label">
    <div class="sec-head">
      <h2 id="done-label">完了</h2>
      <span class="count" id="done-count">0</span>
      <span class="rule"></span>
      <button class="sec-tool" id="done-toggle" type="button" aria-expanded="true" aria-controls="done-list">隠す</button>
      <button class="sec-tool" id="done-clear" type="button" hidden>全部削除</button>
    </div>
    <ul class="list" id="done-list"></ul>
    <p class="empty" id="done-empty">完了したタスクがここに溜まります。</p>
  </section>

  <p class="sr-only" role="status" aria-live="polite" id="live"></p>
</div>

<script>
(function () {
  "use strict";

  var K_LOCAL = "sandan.tasks.local.v1";
  var K_CACHE = "sandan.tasks.cache.v1";
  var K_MIGRATED = "sandan.tasks.migrated.v1";
  var K_DONEOPEN = "sandan.done.open.v1";

  var $ = function (id) { return document.getElementById(id); };
  var input = $("compose-input");
  var addBtn = $("add-btn");
  var urgentFlag = $("urgent-flag");
  var pendingList = $("pending-list");
  var doneList = $("done-list");
  var pendingEmpty = $("pending-empty");
  var doneEmpty = $("done-empty");
  var pendingCount = $("pending-count");
  var doneCount = $("done-count");
  var doneToggle = $("done-toggle");
  var doneClear = $("done-clear");
  var statusEl = $("status");
  var statusText = $("status-text");
  var notice = $("notice");
  var live = $("live");

  var tasks = new Map();     // id -> task
  var optimistic = new Map(); // id -> {data: task|null, until: ms}
  var seen = new Set();       // ids already rendered (for the enter animation)
  var mode = "boot";          // boot | db | local
  var DB = null;
  var doneOpen = true;

  /* ---------- storage helpers (always guarded) ---------- */
  function lsGet(key) {
    try { return window.localStorage.getItem(key); } catch (e) { return null; }
  }
  function lsSet(key, value) {
    try { window.localStorage.setItem(key, value); } catch (e) { /* private mode, blocked storage */ }
  }
  function lsDel(key) {
    try { window.localStorage.removeItem(key); } catch (e) { /* ignore */ }
  }
  function readStore(key) {
    var raw = lsGet(key);
    if (!raw) return null;
    try {
      var parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== "object") return null;
      var map = new Map();
      Object.keys(parsed).forEach(function (id) {
        var t = normalize(parsed[id]);
        if (t) map.set(id, t);
      });
      return map;
    } catch (e) { return null; }
  }
  function writeStore(key, map) {
    var plain = {};
    map.forEach(function (t, id) { plain[id] = t; });
    lsSet(key, JSON.stringify(plain));
  }

  function normalize(raw) {
    if (!raw || typeof raw !== "object" || typeof raw.text !== "string") return null;
    var text = raw.text.trim();
    if (!text) return null;
    return {
      text: text,
      done: !!raw.done,
      urgent: !!raw.urgent,
      createdAt: Number(raw.createdAt) || 0,
      completedAt: raw.completedAt ? Number(raw.completedAt) : null
    };
  }

  /* ---------- dates, in the plainest Japanese ---------- */
  function startOfDay(ms) {
    var d = new Date(ms);
    return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function ageLabel(ts) {
    if (!ts) return "";
    var days = Math.round((startOfDay(Date.now()) - startOfDay(ts)) / 86400000);
    if (days <= 0) return "今日";
    if (days === 1) return "昨日";
    if (days < 7) return days + "日前";
    var d = new Date(ts);
    return (d.getMonth() + 1) + "/" + d.getDate();
  }
  function stampLabel(ts) {
    if (!ts) return "";
    var d = new Date(ts);
    var time = pad(d.getHours()) + ":" + pad(d.getMinutes());
    if (startOfDay(ts) === startOfDay(Date.now())) return "今日 " + time;
    return (d.getMonth() + 1) + "/" + d.getDate() + " " + time;
  }

  /* ---------- rendering ---------- */
  var CHECK_SVG = '<svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">' +
    '<path d="M2.5 8.5 L6 12 L13.5 4" fill="none" stroke-width="2.4" ' +
    'stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function buildRow(id, task) {
    var li = document.createElement("li");
    li.className = "task" + (task.done ? " is-done" : "") + (task.urgent ? " is-urgent" : "");
    if (!seen.has(id)) { li.classList.add("enter"); seen.add(id); }

    var check = document.createElement("button");
    check.type = "button";
    check.className = "check";
    check.setAttribute("aria-label", task.done ? "未完了に戻す" : "完了にする");
    check.title = task.done ? "未完了に戻す" : "完了にする";
    var ring = document.createElement("span");
    ring.className = "ring";
    ring.innerHTML = CHECK_SVG;
    check.appendChild(ring);
    check.addEventListener("click", function () { toggle(id); });

    var body = document.createElement("div");
    body.className = "task-body";
    var p = document.createElement("p");
    p.className = "task-text";
    p.textContent = task.text;
    var meta = document.createElement("span");
    meta.className = "task-meta";
    if (task.urgent) {
      var flag = document.createElement("span");
      flag.className = "flag";
      flag.textContent = "緊急";
      meta.appendChild(flag);
    }
    meta.appendChild(document.createTextNode(
      task.done ? stampLabel(task.completedAt) + " に完了" : ageLabel(task.createdAt)
    ));
    body.appendChild(p);
    body.appendChild(meta);

    var kill = document.createElement("button");
    kill.type = "button";
    kill.className = "kill";
    kill.setAttribute("aria-label", "このタスクを削除");
    kill.title = "削除";
    kill.textContent = "×";
    kill.addEventListener("click", function () { remove(id); });

    li.appendChild(check);
    li.appendChild(body);
    li.appendChild(kill);
    return li;
  }

  function render() {
    var pend = [];
    var done = [];
    tasks.forEach(function (task, id) {
      (task.done ? done : pend).push({ id: id, task: task });
    });
    pend.sort(function (a, b) {
      var urgency = (b.task.urgent ? 1 : 0) - (a.task.urgent ? 1 : 0);
      return urgency !== 0 ? urgency : b.task.createdAt - a.task.createdAt;
    });
    done.sort(function (a, b) { return (b.task.completedAt || 0) - (a.task.completedAt || 0); });

    var frag = document.createDocumentFragment();
    pend.forEach(function (row) { frag.appendChild(buildRow(row.id, row.task)); });
    pendingList.textContent = "";
    pendingList.appendChild(frag);

    var frag2 = document.createDocumentFragment();
    done.forEach(function (row) { frag2.appendChild(buildRow(row.id, row.task)); });
    doneList.textContent = "";
    doneList.appendChild(frag2);

    pendingCount.textContent = pend.length;
    doneCount.textContent = done.length;
    pendingEmpty.hidden = pend.length > 0;
    doneEmpty.hidden = done.length > 0;
    doneList.hidden = !doneOpen;
    doneToggle.hidden = done.length === 0;
    doneToggle.textContent = doneOpen ? "隠す" : "表示";
    doneToggle.setAttribute("aria-expanded", doneOpen ? "true" : "false");
    doneClear.hidden = done.length === 0 || !doneOpen;
  }

  function say(message) { live.textContent = message; }
  function warn(message) {
    if (!message) { notice.hidden = true; return; }
    notice.textContent = message;
    notice.hidden = false;
  }
  function setStatus(state, text) {
    statusEl.setAttribute("data-state", state);
    statusText.textContent = text;
  }

  /* ---------- writes ---------- */
  function keepLocal() {
    if (mode === "local") writeStore(K_LOCAL, tasks);
    else writeStore(K_CACHE, tasks);
  }
  function mark(id, data) {
    optimistic.set(id, { data: data, until: Date.now() + 3000 });
  }
  function dbError(e) {
    var code = e && e.code ? e.code : "unavailable";
    if (code === "quota_exceeded") {
      warn("保存できる件数の上限に達しました。完了タスクを削除すると追加できます。");
    } else if (code === "resource_exhausted") {
      warn("操作が続きすぎました。少し待ってからもう一度お試しください。");
    } else if (code === "revoked" || code === "not_granted") {
      fallbackToLocal();
      warn("同期が使えなくなったため、この端末だけに保存しています。");
    } else if (code === "invalid_argument") {
      warn("この内容は保存できませんでした。文字数を減らしてお試しください。");
    } else {
      warn("保存に失敗しました。通信状況を確かめて、もう一度お試しください。");
    }
  }

  function put(id, task) {
    tasks.set(id, task);
    render();
    if (mode === "db" && DB) {
      mark(id, task);
      DB.doc("tasks/" + id).set(task).then(function () { warn(""); }, dbError);
    }
    keepLocal();
  }
  function remove(id) {
    var gone = tasks.get(id);
    tasks.delete(id);
    seen.delete(id);
    render();
    say("削除しました");
    if (mode === "db" && DB) {
      mark(id, null);
      DB.doc("tasks/" + id).delete().then(function () { warn(""); }, function (e) {
        if (gone) { tasks.set(id, gone); render(); }
        dbError(e);
      });
    }
    keepLocal();
  }
  function toggle(id) {
    var task = tasks.get(id);
    if (!task) return;
    var next = {
      text: task.text,
      done: !task.done,
      urgent: task.urgent,
      createdAt: task.createdAt,
      completedAt: !task.done ? Date.now() : null
    };
    put(id, next);
    say(next.done ? "完了タスクに移しました" : "未完了タスクに戻しました");
  }

  function newId() {
    if (mode === "db" && DB) {
      try { return DB.collection("tasks").doc().id; } catch (e) { /* fall through */ }
    }
    return "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function add() {
    var text = input.value.replace(/\s+$/, "").replace(/^\s+/, "");
    if (!text) { input.focus(); return; }
    var urgent = urgentFlag.checked;
    put(newId(), { text: text, done: false, urgent: urgent, createdAt: Date.now(), completedAt: null });
    input.value = "";
    urgentFlag.checked = false;
    autoGrow();
    syncButton();
    input.focus();
    say(urgent ? "緊急として未完了タスクの先頭に追加しました" : "未完了タスクに追加しました");
  }

  function clearDone() {
    var ids = [];
    tasks.forEach(function (task, id) { if (task.done) ids.push(id); });
    if (!ids.length) return;
    if (!window.confirm("完了タスク " + ids.length + " 件を削除します。よろしいですか?")) return;
    ids.forEach(function (id) { tasks.delete(id); seen.delete(id); });
    render();
    keepLocal();
    say("完了タスクを削除しました");
    if (mode === "db" && DB) {
      var chain = Promise.resolve();
      ids.forEach(function (id) {
        mark(id, null);
        chain = chain.then(function () { return DB.doc("tasks/" + id).delete(); });
      });
      chain.then(function () { warn(""); }, dbError);
    }
  }

  /* ---------- compose box ---------- */
  function autoGrow() {
    input.style.height = "auto";
    input.style.height = Math.max(88, input.scrollHeight) + "px";
  }
  function syncButton() { addBtn.disabled = input.value.trim().length === 0; }

  input.addEventListener("input", function () { autoGrow(); syncButton(); });
  input.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    if (e.isComposing || e.keyCode === 229) return; // 日本語入力の確定中は無視
    if (e.shiftKey && !(e.metaKey || e.ctrlKey)) return; // Shift+Enter は改行
    e.preventDefault();
    add();
  });
  addBtn.addEventListener("click", add);
  doneClear.addEventListener("click", clearDone);
  doneToggle.addEventListener("click", function () {
    doneOpen = !doneOpen;
    lsSet(K_DONEOPEN, doneOpen ? "1" : "0");
    render();
  });

  /* ---------- boot: paint from whatever we already know ---------- */
  doneOpen = lsGet(K_DONEOPEN) !== "0";
  var cached = readStore(K_CACHE) || readStore(K_LOCAL);
  if (cached) { tasks = cached; cached.forEach(function (t, id) { seen.add(id); }); }
  render();
  autoGrow();
  syncButton();

  function fallbackToLocal() {
    if (mode === "local") return;
    mode = "local";
    setStatus("local", "この端末のみに保存");
    writeStore(K_LOCAL, tasks);
  }

  function applySnapshot(snap) {
    var next = new Map();
    snap.docs.forEach(function (doc) {
      var task = normalize(doc.data());
      if (task) next.set(doc.id, task);
    });
    var now = Date.now();
    optimistic.forEach(function (entry, id) {
      if (entry.until < now) { optimistic.delete(id); return; }
      if (entry.data === null) next.delete(id);
      else next.set(id, entry.data);
    });
    tasks = next;
    render();
    keepLocal();
  }

  function migrateLocalIfNeeded(snap) {
    if (snap.metadata.fromCache) return false; // wait for a server-definitive view
    if (lsGet(K_MIGRATED) === "1") return true;
    lsSet(K_MIGRATED, "1");
    if (!snap.empty) return true;
    var local = readStore(K_LOCAL);
    if (!local || local.size === 0) return true;
    var chain = Promise.resolve();
    local.forEach(function (task, id) {
      tasks.set(id, task);
      mark(id, task);
      chain = chain.then(function () { return DB.doc("tasks/" + id).set(task); });
    });
    render();
    chain.then(function () { lsDel(K_LOCAL); }, dbError);
    return true;
  }

  if (!window.claude || typeof window.claude.use !== "function") {
    fallbackToLocal();
  } else {
    window.claude.use("db").then(function (db) {
      if (!db) { fallbackToLocal(); return; }
      DB = db;
      mode = "db";
      setStatus("synced", "iPhone / Mac で同期");
      var needMigrate = true;
      DB.collection("tasks").limit(1000).onSnapshot(function (snap) {
        applySnapshot(snap);
        if (needMigrate && migrateLocalIfNeeded(snap)) needMigrate = false;
        warn("");
      }, function (e) {
        var code = e && e.code ? e.code : "unavailable";
        if (code === "revoked" || code === "not_granted" || code === "capability_disabled") {
          fallbackToLocal();
        } else {
          warn("同期が止まりました。ページを再読み込みしてください。");
        }
      });
    }, function () { fallbackToLocal(); });
  }
})();
</script>
